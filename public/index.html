<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IP-CRM · 知识产权代理管理</title>
<style>
  :root {
    --bg: #f5f5f7;
    --bg-glow-1: rgba(0,113,227,.10);
    --bg-glow-2: rgba(120,80,255,.08);
    --surface: #ffffff;
    --surface2: rgba(255,255,255,.70);
    --glass: rgba(255,255,255,.60);
    --text: #1d1d1f;
    --text2: #6e6e73;
    --text3: #a1a1a6;
    --border: rgba(0,0,0,.08);
    --border2: rgba(0,0,0,.05);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-soft: rgba(0,113,227,.10);
    --danger: #ff3b30;
    --danger-soft: rgba(255,59,48,.10);
    --warn: #ff9f0a;
    --warn-soft: rgba(255,159,10,.14);
    --ok: #34c759;
    --ok-soft: rgba(52,199,89,.14);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 2px 8px rgba(0,0,0,.05), 0 16px 44px rgba(0,0,0,.08);
    --shadow-lg: 0 8px 20px rgba(0,0,0,.10), 0 24px 64px rgba(0,0,0,.14);
    --r-lg: 18px;
    --r-md: 12px;
    --r-pill: 980px;
    --spring: cubic-bezier(0.32,0.72,0,1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-glow-1: rgba(0,113,227,.18);
      --bg-glow-2: rgba(120,80,255,.12);
      --surface: #1c1c1e;
      --surface2: rgba(28,28,30,.72);
      --glass: rgba(30,30,32,.66);
      --text: #f5f5f7;
      --text2: #98989d;
      --text3: #636366;
      --border: rgba(255,255,255,.12);
      --border2: rgba(255,255,255,.06);
      --accent-soft: rgba(10,132,255,.16);
      --danger-soft: rgba(255,69,58,.16);
      --warn-soft: rgba(255,159,10,.18);
      --ok-soft: rgba(48,209,88,.16);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 2px 10px rgba(0,0,0,.5), 0 18px 48px rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 15px/1.5 var(--font);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(42rem 30rem at 12% -6%, var(--bg-glow-1), transparent 60%),
      radial-gradient(38rem 28rem at 92% 4%, var(--bg-glow-2), transparent 62%),
      var(--bg);
  }
  input, select, textarea, button { font: inherit; color: inherit; }
  ::placeholder { color: var(--text3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { cursor: pointer; }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    border: 0; border-radius: var(--r-pill);
    padding: 9px 18px; font-weight: 500; font-size: 14px;
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border);
    transition: transform .12s ease-out, background .2s ease, box-shadow .2s ease, opacity .2s ease;
    white-space: nowrap;
  }
  .btn:hover { box-shadow: var(--shadow-md), inset 0 0 0 1px var(--border); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: none; }
  .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-md); }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  .btn-ghost:hover { background: rgba(0,113,227,.16); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); box-shadow: none; }
  .btn-danger:hover { background: rgba(255,59,48,.18); }
  .btn-sm { padding: 5px 12px; font-size: 13px; }
  .btn-block { width: 100%; }
  .icon-btn {
    border: 0; background: transparent; color: var(--text2); border-radius: var(--r-pill);
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s, transform .12s;
  }
  .icon-btn:hover { background: var(--border2); color: var(--text); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 19px; height: 19px; }

  /* ---------- 徽章 ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 10px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 600; line-height: 1.6;
    background: var(--border2); color: var(--text2);
    letter-spacing: .01em;
  }
  .b-tm { background: var(--accent-soft); color: var(--accent); }
  .b-cp { background: var(--warn-soft); color: var(--warn); }
  .b-sc { background: var(--ok-soft); color: var(--ok); }
  .b-lc { background: #5e5ce6; color: #fff; }
  .b-rg { background: #ff9f0a; color: #fff; }
  .b-sw { background: #ff3b30; color: #fff; }
  .b-sv { background: #00c7be; color: #fff; }
  .b-active { background: var(--accent-soft); color: var(--accent); }
  .b-completed { background: var(--ok-soft); color: var(--ok); }
  .b-terminated { background: var(--danger-soft); color: var(--danger); }
  .b-paid { background: var(--ok-soft); color: var(--ok); }
  .b-partial { background: var(--warn-soft); color: var(--warn); }
  .b-unpaid { background: var(--border2); color: var(--text3); }
  .b-overdue { background: var(--danger-soft); color: var(--danger); }
  .b-pending { background: var(--warn-soft); color: var(--warn); }
  .b-done { background: var(--ok-soft); color: var(--ok); }
  .b-company { background: var(--accent-soft); color: var(--accent); }
  .b-sole { background: var(--warn-soft); color: var(--warn); }
  .b-individual { background: var(--ok-soft); color: var(--ok); }
  .b-org { background: var(--border2); color: var(--text3); }

  /* ---------- 登录页 ---------- */
  #login-view {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 384px;
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-radius: 24px; padding: 40px 36px 34px;
    box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--border);
    animation: rise .5s var(--spring);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px; margin-bottom: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff; letter-spacing: .02em;
    background: linear-gradient(135deg, #0a84ff, #5e5ce6 70%, #bf5af2);
    box-shadow: 0 8px 20px rgba(10,132,255,.35);
  }
  .login-card h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .login-card .sub { margin: 6px 0 28px; color: var(--text2); font-size: 14px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 0; border-radius: var(--r-md);
    padding: 10px 14px; font-size: 15px;
    background: var(--surface); color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border);
    transition: box-shadow .2s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; box-shadow: inset 0 0 0 2px var(--accent);
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .error-msg { display: none; color: var(--danger); font-size: 13px; margin: 4px 0 10px; }
  .hint { margin-top: 18px; text-align: center; color: var(--text3); font-size: 12px; }

  /* ---------- 后台布局 ---------- */
  #app-view { display: none; min-height: 100vh; }
  .app-shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--surface2);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; }
  .brand .logo-mark { width: 34px; height: 34px; border-radius: 9px; font-size: 15px; margin: 0; box-shadow: 0 4px 12px rgba(10,132,255,.3); }
  .brand b { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .side-nav { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; border: 0; background: transparent;
    padding: 11px 14px; border-radius: var(--r-md);
    color: var(--text2); font-size: 14.5px; font-weight: 500; text-align: left;
    transition: background .2s ease, color .2s ease, transform .12s ease-out;
  }
  .nav-item svg { width: 19px; height: 19px; flex: none; }
  .nav-item:hover { background: var(--border2); color: var(--text); }
  .nav-item:active { transform: scale(.98); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-sep { height: 1px; background: var(--border); margin: 8px 6px; }
  .side-foot { border-top: 1px solid var(--border); padding-top: 12px; }

  .main-col { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    height: 60px; padding: 0 28px;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }
  .burger { display: none; }
  .crumb { font-size: 15px; font-weight: 600; letter-spacing: -.01em; flex: 1; }
  .crumb small { color: var(--text3); font-weight: 500; margin-right: 8px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .user { font-size: 13.5px; color: var(--text2); font-weight: 500; }
  .user b { color: var(--text); font-weight: 600; }

  .view-content { padding: 28px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .page-head h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .page-head p { color: var(--text2); font-size: 13.5px; margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .toolbar input, .toolbar select {
    border: 0; border-radius: var(--r-pill);
    padding: 9px 16px; font-size: 14px;
    background: var(--surface); color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar select { min-width: 132px; }
  .toolbar input:focus, .toolbar select:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

  .empty {
    text-align: center; color: var(--text3); padding: 52px 16px; font-size: 14px;
  }
  .empty::before { content: "↕"; display: block; font-size: 26px; margin-bottom: 10px; opacity: .5; }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border2);
    overflow: hidden;
  }
  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(316px, 1fr));
    gap: 16px;
  }
  .card-item {
    background: var(--surface);
    border-radius: var(--r-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border2);
    transition: transform .18s var(--spring), box-shadow .25s ease;
    animation: rise .4s var(--spring) backwards;
  }
  .card-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md), inset 0 0 0 1px var(--border2); }
  .card-item.clickable { cursor: pointer; }
  .card-item.clickable:active { transform: scale(.985); }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 42px; height: 42px; flex: none; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    background: linear-gradient(135deg, #0a84ff, #5e5ce6);
  }
  .card-head .tt { flex: 1; min-width: 0; }
  .card-head .tt b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-head .tt span { font-size: 12.5px; color: var(--text3); }
  .card-body { color: var(--text2); font-size: 13.5px; }
  .card-body .kv { display: flex; gap: 6px; margin: 5px 0; }
  .card-body .kv .k { color: var(--text3); width: 56px; flex: none; }
  .card-body .kv .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border2); }

  /* ---------- 看板 ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat {
    background: var(--surface);
    border-radius: var(--r-lg); padding: 18px 20px;
    box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border2);
    animation: rise .4s var(--spring) backwards;
  }
  .stat .label { font-size: 12.5px; color: var(--text3); font-weight: 500; }
  .stat .value { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 960px) { .dash-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border2); }
  .panel h3 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 14px; }
  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--r-md);
    transition: background .2s ease;
  }
  .list-row:hover { background: var(--border2); }
  .list-row.clickable { cursor: pointer; }
  .list-row .t { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .list-row .t span.ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-row .s { color: var(--text3); font-size: 12.5px; margin-top: 2px; }
  .list-row .grow { flex: 1; min-width: 0; }

  /* ---------- 期限列表卡片 ---------- */
  .dl-card { display: flex; align-items: center; gap: 14px; }
  .dl-due { flex: none; text-align: center; min-width: 58px; }
  .dl-due b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .dl-due span { font-size: 11.5px; color: var(--text3); }
  .dl-due.overdue b { color: var(--danger); }

  /* ---------- 表格（备用，暂用于无） ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text3); padding: 12px 16px; border-bottom: 1px solid var(--border2); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--border2); color: var(--text); }
  tr:last-child td { border-bottom: 0; }

  /* ---------- 抽屉 ---------- */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: min(560px, 94vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    transform: translateX(102%);
    transition: transform .42s var(--spring);
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: none; }
  .drawer header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 24px; border-bottom: 1px solid var(--border2);
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    position: sticky; top: 0;
  }
  .drawer header .dt { font-size: 17px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer .body { padding: 22px 24px; overflow-y: auto; flex: 1; }
  .drawer-overlay {
    position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.32);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .drawer-overlay.show { opacity: 1; pointer-events: auto; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-bottom: 22px; }
  .kv .k { font-size: 12px; color: var(--text3); margin-bottom: 3px; }
  .kv .v { font-size: 14px; font-weight: 500; word-break: break-word; }
  .tabs { display: flex; gap: 4px; background: var(--border2); border-radius: var(--r-md); padding: 4px; margin-bottom: 18px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; border-radius: 10px;
    padding: 8px 6px; font-size: 13.5px; font-weight: 500; color: var(--text2);
    transition: background .2s, color .2s;
  }
  .tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .fee-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 14px; border-radius: var(--r-md);
    box-shadow: inset 0 0 0 1px var(--border2); margin-bottom: 10px;
  }
  .fee-row .main { flex: 1; min-width: 0; }
  .fee-row .main .amounts { color: var(--text3); font-size: 12.5px; margin-top: 5px; }
  .fee-row .actions { display: flex; gap: 6px; flex: none; }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border2); }
  .tl-item { position: relative; padding: 0 0 20px 12px; }
  .tl-item::before {
    content: ""; position: absolute; left: -20px; top: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .tl-item .stage { font-weight: 600; font-size: 14px; }
  .tl-item .meta { font-size: 12px; color: var(--text3); margin: 2px 0 6px; }
  .tl-item .content { font-size: 13.5px; color: var(--text2); white-space: pre-wrap; }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 70;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(0,0,0,.34);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .28s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    background: var(--surface);
    border-radius: 20px; padding: 26px;
    box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--border);
    transform: translateY(10px) scale(.98);
    transition: transform .32s var(--spring);
  }
  .overlay.show .modal { transform: none; }
  .modal h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ---------- Toast ---------- */
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast-item {
    padding: 10px 20px; border-radius: var(--r-pill);
    font-size: 13.5px; font-weight: 500;
    background: var(--surface2);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: var(--shadow-md), inset 0 0 0 1px var(--border);
    animation: toast-in .32s var(--spring);
  }
  .toast-item.ok { color: var(--ok); }
  .toast-item.error { color: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  /* ---------- 扩展页面样式 ---------- */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: left; color: var(--text3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border2); }
  .tbl td { padding: 10px; border-bottom: 1px solid var(--border2); }
  .tbl tr.row:hover td { background: var(--border2); }
  .tbl tr.row { cursor: pointer; }
  .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 12px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
  .bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
  .bar { width: 100%; max-width: 30px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, transparent)); min-height: 2px; }
  .bar.rec { background: linear-gradient(180deg, var(--ok), color-mix(in srgb, var(--ok) 55%, transparent)); }
  .bar-col .lb { font-size: 11.5px; color: var(--text3); flex: none; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text3); margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .prog-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
  .prog-row .lbl { width: 72px; font-size: 13px; color: var(--text3); flex: none; }
  .prog-track { flex: 1; height: 8px; border-radius: 5px; background: var(--border2); overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .prog-val { width: 76px; text-align: right; font-size: 13px; font-weight: 600; flex: none; }
  .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 920px) { .set-grid { grid-template-columns: 1fr; } }
  .small-hint { font-size: 12px; color: var(--text3); margin-top: 6px; }
  .dl-cell { font-size: 12.5px; color: var(--text3); font-weight: 500; }
  .list-col { display: flex; flex-direction: column; }
  .switch-label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text2); cursor: pointer; }
  .switch-label input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- 响应式 ---------- */
  .scrim { display: none; }
  @media (max-width: 920px) {
    .app-shell { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; z-index: 50; width: 264px; transform: translateX(-102%); transition: transform .38s var(--spring); box-shadow: var(--shadow-lg); }
    .sidebar.show { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.32); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .burger { display: inline-flex; }
    .view-content { padding: 20px 16px; }
    .topbar { padding: 0 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .drawer, .modal, .overlay, .sidebar { transition: opacity .2s ease; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .sidebar, .topbar, .login-card, .toast-item, .drawer header { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>
<body>
  <!-- 登录视图 -->

      <div class="error-msg" id="login-error"></div>
      <button class="btn btn-primary btn-block" id="login-btn" type="submit">登 录</button>

  <!-- 后台视图 -->
  <div id="app-view">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="logo-mark">IP</div><b>IP-CRM</b></div>
        <nav class="side-nav">

          </button>
          <button class="nav-item" data-view="leads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
            销售线索
          </button>
          <button class="nav-item" data-view="logs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
            操作日志
          </button>
          <button class="nav-item" data-view="company">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V7l6-4 6 4v14M10 9h4M10 13h4M10 17h4"/></svg>

          <button class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            系统管理

        <div class="side-foot">
          <button class="nav-item" id="logout-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
            退出登录

      </aside>
      <div class="scrim" id="side-scrim"></div>

      <div class="main-col">
        <header class="topbar">
          <button class="icon-btn burger" id="burger-btn" aria-label="菜单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="crumb"><small id="crumb-sub">知识产权代理</small><span id="crumb-title">看板</span></div>
          <div class="topbar-right"><span class="user">你好，<b id="me-label"></b></span></div>
        </header>
        <main id="view-dashboard" class="view"><div class="view-content"></div></main>
        <main id="view-customers" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-cases" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-deadlines" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-finance" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-stats" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-logs" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-settings" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-leads" class="view" style="display:none"><div class="view-content"></div></main>
        <main id="view-company" class="view" style="display:none"><div class="view-content"></div></main>
      </div>

  </div>

  <!-- 弹窗与抽屉容器 -->
  <div class="overlay" id="modal-overlay">
    <div class="modal" id="modal-box"></div>
  </div>
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer"><header><span class="dt" id="drawer-title"></span><button class="btn btn-ghost btn-sm" id="drawer-close">关闭</button></header><div class="body" id="drawer-body"></div></aside>
  <div id="toast"></div>

  <script>
    "use strict";
    // ---------- 常量 ----------
    const CASE_TYPES = { trademark: "商标代理", copyright: "版权代理", "software-copyright": "软件著作权", "legal-consult": "法律咨询", registration: "注册登记", software: "软件开发", service: "数据服务" };
    const CATEGORIES = {
      trademark: ["注册申请","驳回复审","异议","无效宣告","续展","变更","转让"],
      copyright: ["作品登记","变更","撤销"],
      "software-copyright": ["软件著作权登记","变更","补发证书"],
      "legal-consult": ["一般咨询","合同审查","法律意见","侵权分析","非诉代理"],
      registration: ["公司设立","公司变更","个体户注册","注销","年报"],
      software: ["项目开发","软件销售","定制开发","系统集成"],
      service: ["数据服务","信息系统运维","云计算服务","网络安全服务"],
    };
    const TYPE_BADGE = { trademark: "b-tm", copyright: "b-cp", "software-copyright": "b-sc", "legal-consult": "b-lc", registration: "b-rg", software: "b-sw", service: "b-sv" };
    const LEAD_STATUS_LABEL = { new: "新线索", contacted: "已联系", qualified: "有意向", negotiating: "洽谈中", won: "已成交", lost: "已流失" };
    const LEAD_SOURCE_LABEL = { referral: "转介绍", website: "官网咨询", ad: "广告投放", "cold-call": "主动联系", "walk-in": "上门", other: "其他" };
    const LEAD_SOURCE_BADGE = { referral: "b-tm", website: "b-cp", ad: "b-sw", "cold-call": "b-lc", "walk-in": "b-rg", other: "b-sv" };
    const STATUS_LABEL = { active: "进行中", completed: "已完成", terminated: "已终止" };
    const FEE_KIND_LABEL = { official: "官费", agency: "代理费" };
    const FEE_STATUS_LABEL = { unpaid: "未收", partial: "部分", paid: "已收" };
    const DL_TYPE_LABEL = { renewal: "续展提醒", official_reply: "官方答复", fee: "费用缴纳" };
    const CUST_KIND_LABEL = { individual: "个人", sole: "个体户", company: "公司", org: "其他组织" };
    const CUST_KIND_ID_LABEL = { individual: "身份证号", sole: "营业执照注册号", company: "统一社会信用代码", org: "统一社会信用代码" };
    const CUST_KIND_BADGE = { individual: "b-individual", sole: "b-sole", company: "b-company", org: "b-org" };
    const VIEW_TITLE = { dashboard: "管理面板", customers: "客户管理", cases: "业务管理", deadlines: "期限提醒", finance: "财务管理", stats: "业务统计", logs: "操作日志", settings: "系统管理", leads: "销售线索", company: "公司信息" };

    // ---------- 工具 ----------
    const $ = (s, el) => (el || document).querySelector(s);
    const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const yuan = (cents) => ((cents ?? 0) / 100).toFixed(2);
    const yuanInput = (cents) => yuan(cents).replace(/\.00$/, "");
    const toCents = (str) => { const n = Number(str); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };
    const fmtDate = (iso) => iso || "";
    const today = () => new Date().toISOString().slice(0, 10);
    const initials = (s) => { const t = String(s || "").trim(); return t ? t.slice(0, 1).toUpperCase() : "?"; };

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (res.status === 401) { location.reload(); throw new Error("会话已过期"); }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || "请求失败");
      return data;
    }
    function toast(msg, kind = "") {
      const el = document.createElement("div");
      el.className = "toast-item " + kind;
      el.textContent = msg;
      $("#toast").appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }
    function openModal(html) {
      $("#modal-box").innerHTML = html;
      $("#modal-overlay").classList.add("show");
    }
    async function download(path) {
      const res = await fetch(path, { credentials: "same-origin" });
      if (!res.ok) { let msg = "下载失败"; try { msg = (await res.json()).error || msg; } catch (_) {} toast(msg, "error"); return; }
      const cd = res.headers.get("Content-Disposition") || "";
      const m = cd.match(/filename="?([^";]+)"?/);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(await res.blob());
      a.download = m ? m[1] : "download";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    }
    function closeModal() { $("#modal-overlay").classList.remove("show"); }
    $("#modal-overlay").addEventListener("click", (e) => { if (e.target === $("#modal-overlay")) closeModal(); });

    // ---------- 登录 ----------
    function showApp(username) {
      $("#login-view").style.display = "none";
      $("#app-view").style.display = "block";
      $("#me-label").textContent = username;
    }
    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("#login-error");
      err.style.display = "none";
      const btn = $("#login-btn");
      btn.disabled = true;
      try {
        await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ username: $("#username").value, password: $("#password").value }),
        });
        showApp($("#username").value);
        setView("dashboard");
      } catch (ex) { err.textContent = ex.message || "登录失败"; err.style.display = "block"; }
      finally { btn.disabled = false; }
    });
    $("#logout-btn").addEventListener("click", async () => {
      try { await api("/api/logout", { method: "POST" }); } catch (_) {}
      location.reload();
    });

    // ---------- 导航 ----------
    let currentView = "dashboard";
    const loaders = { dashboard: loadDashboard, customers: loadCustomers, cases: loadCases, deadlines: loadDeadlines, finance: loadFinance, stats: loadStats, logs: loadLogs, settings: loadSettings, leads: loadLeads, company: loadCompany };
    function setView(name) {
      currentView = name;
      $$(".nav-item[data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === name));
      $$("main.view").forEach((v) => (v.style.display = "none"));
      const view = $("#view-" + name);
      view.style.display = "block";
      $("#crumb-title").textContent = VIEW_TITLE[name] || name;
      closeSidebar();
      loaders[name]();
    }
    $$(".nav-item[data-view]").forEach((btn) => btn.addEventListener("click", () => setView(btn.dataset.view)));

    // ---------- 移动端侧边栏 ----------
    const sidebar = $("#sidebar");
    function openSidebar() { sidebar.classList.add("show"); $("#side-scrim").classList.add("show"); }
    function closeSidebar() { sidebar.classList.remove("show"); $("#side-scrim").classList.remove("show"); }
    $("#burger-btn").addEventListener("click", openSidebar);
    $("#side-scrim").addEventListener("click", closeSidebar);

    // ---------- 看板 ----------
    async function loadDashboard() {
      const el = $("#view-dashboard .view-content");
      let dash;
      try { dash = await api("/api/dashboard"); }
      catch (ex) { el.innerHTML = `<div class="empty">${esc(ex.message)}</div>`; return; }
      const cc = dash.caseCounts, ft = dash.feeTotals;
      const stat = (label, value, color = "") => `<div class="stat"><div class="label">${label}</div><div class="value" style="${color}">${value}</div></div>`;
      el.innerHTML = `
        <div class="page-head">
          <div><h1>管理面板</h1><p>业务概览与到期提醒</p></div>
        </div>
        <div class="stats">
          ${stat("案件总数", cc.total)}
          ${stat("进行中", cc.active, "color:var(--accent)")}
          ${stat("已完成", cc.completed, "color:var(--ok)")}
          ${stat("应收费用", "¥" + yuan(ft.receivable))}
          ${stat("实收费用", "¥" + yuan(ft.received), "color:var(--ok)")}
          ${stat("待收费用", "¥" + yuan(ft.pending), ft.pending > 0 ? "color:var(--warn)" : "")}
          ${stat("跟进线索", dash.activeLeads ?? 0, (dash.activeLeads ?? 0) > 0 ? "color:var(--accent)" : "")}
        </div>
        <div class="dash-grid">
          <div class="panel">
            <h3>到期提醒（30 天内 / 已逾期）</h3>
            ${dash.upcomingDeadlines.length === 0
              ? `<div class="empty">暂无待办期限</div>`
              : dash.upcomingDeadlines.map((d) => `
                <div class="list-row">
                  <span class="badge ${d.overdue ? "b-overdue" : "b-pending"}">${d.overdue ? "已逾期" : "将到期"}</span>
                  <div class="grow">
                    <div class="t"><span class="ttl">${esc(d.title)}</span></div>
                    <div class="s">${esc(d.customerName)} · ${esc(d.caseTitle)} · 截止 ${fmtDate(d.dueDate)} · ${DL_TYPE_LABEL[d.type]}</div>
                  </div>
                  <button class="btn btn-ghost btn-sm" onclick="toggleDeadline('${d.id}')">完成</button>
                </div>`).join("")}
          </div>
          <div class="panel">
            <h3>近期案件</h3>
            ${dash.recentCases.length === 0
              ? `<div class="empty">暂无案件</div>`
              : dash.recentCases.map((c) => `
                <div class="list-row clickable" onclick="openCaseDetail('${c.id}')">
                  <span class="badge ${TYPE_BADGE[c.type]}">${CASE_TYPES[c.type]}</span>
                  <div class="grow">
                    <div class="t"><span class="ttl">${esc(c.title)}</span></div>
                    <div class="s">${esc(c.category)} · ${STATUS_LABEL[c.status]} · ${esc(c.stage)}</div>
                  </div>
                </div>`).join("")}
          </div>
        </div>`;
    }

    // ---------- 客户（卡片列表） ----------
    async function loadCustomers() {
      const el = $("#view-customers .view-content");
      const q = $("#cust-q") ? $("#cust-q").value : "";
      const kind = $("#cust-kind") ? $("#cust-kind").value : "";
      el.innerHTML = `
        <div class="page-head">
          <div><h1>客户管理</h1><p>客户档案，删除客户将级联清理其案件</p></div>
          <button class="btn btn-primary" onclick="openCustomerForm()">+ 新增客户</button>
        </div>
        <div class="toolbar">
          <input id="cust-q" placeholder="搜索姓名 / 公司 / 证照号 / 经办人" value="${esc(q)}" oninput="debouncedCustomers()" />
          <select id="cust-kind" onchange="loadCustomers()">
            <option value="">全部主体类型</option>
            ${Object.entries(CUST_KIND_LABEL).map(([k, v]) => `<option value="${k}" ${k === kind ? "selected" : ""}>${v}</option>`).join("")}

    async function ocrCompress(file) {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("图片读取失败")); i.src = URL.createObjectURL(file); });
      const max = 1200; let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      return cv.toDataURL("image/jpeg", 0.85).split(",")[1];
    }
    function uploadOcr(type) {
      const input = document.createElement("input");
      input.type = "file"; input.accept = "image/*";
      input.onchange = async () => {
        const f = input.files && input.files[0]; if (!f) return;
        try {
          const b64 = await ocrCompress(f);
          const r = await api(type === "biz" ? "/api/ocr/biz-license" : "/api/ocr/id-card", { method: "POST", body: JSON.stringify({ image: b64 }) });
          if (type === "biz") {
            const kind = (r.regNum || "").startsWith("92") ? "sole" : "company";
            $("#cf-kind").value = kind;
            document.getElementById("cf-idno-label").textContent = custKindIdLabel();
            if (r.name) $("#cf-company").value = r.name;
            if (r.regNum) $("#cf-idno").value = r.regNum;
            if (r.address) $("#cf-address").value = r.address;
            if (r.legalPerson && !$("#cf-contact-name").value) $("#cf-contact-name").value = r.legalPerson;
            toast("营业执照识别成功，已自动填充，请核对", "ok");
          } else {
            $("#cf-kind").value = "individual";
            document.getElementById("cf-idno-label").textContent = custKindIdLabel();
            if (r.name && !$("#cf-name").value) $("#cf-name").value = r.name;
            if (r.idNum) $("#cf-idno").value = r.idNum;
            if (r.address) $("#cf-address").value = r.address;
            toast("身份证识别成功，已自动填充，请核对", "ok");
          }
        } catch (ex) { toast(ex.message, "error"); }
      };
      input.click();
    }

    // ---------- 业务统计 ----------
    async function loadStats() {
      const el = $("#view-stats .view-content");
      el.innerHTML = `<div class="page-head"><div><h1>业务统计</h1><p>案件分布 · 费用趋势 · 客户排名</p></div></div><div class="dash-grid"><div class="panel">加载中…</div></div>`;
      const s = await api("/api/stats");
      const dist = s.caseDistribution;
      const total = Object.values(dist.byType).reduce((a, b) => a + b, 0);
      const typeColors = ["#0a84ff", "#bf5af2", "#5e5ce6", "#ff9f0a", "#34c759", "#ff3b30", "#00c7be"];
      const typeRows = Object.entries(dist.byType).map(([key, n], i) => {
        const pct = total ? Math.round((n / total) * 100) : 0;
        const label = dist.typeLabels[key] || key;
        return `<div class="prog-row"><span class="lbl">${esc(label)}</span><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${typeColors[i % typeColors.length]}"></div></div><span class="prog-val">${n} · ${pct}%</span></div>`;
      }).join("");
      const maxR = Math.max(1, ...s.feeTrend.map((m) => Math.max(m.receivable, m.received)));
      const bars = s.feeTrend.map((m) => `
        <div class="bar-col" title="${m.label}：应收 ¥${yuan(m.receivable)} / 实收 ¥${yuan(m.received)}">
          <div class="bar-wrap">
            <div class="bar" style="height:${Math.max(2, (m.received / maxR) * 100)}%"></div>
            <div class="bar rec" style="height:${Math.max(2, (m.received / maxR) * 100)}%"></div>
          </div>
          <div class="lb">${m.label}</div>
        </div>`).join("");
      const prog = (lbl, key, color = "var(--accent)") => {
        const n = s.caseDistribution.byStatus[key];
        const pct = total ? Math.round((n / total) * 100) : 0;
        return `<div class="prog-row"><span class="lbl">${lbl}</span><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div><span class="prog-val">${n} · ${pct}%</span></div>`;
      };
      el.innerHTML = `
        <div class="page-head">
          <div><h1>业务统计</h1><p>案件分布 · 费用趋势 · 客户排名</p></div>
        </div>
        <div class="dash-grid">
          <div class="panel">
            <h3>业务类型分布（共 ${total} 件）</h3>
            ${typeRows}
            <h3 style="margin-top:22px">业务状态</h3>
            ${prog("进行中", "active")}
            ${prog("已完成", "completed", "var(--ok)")}
            ${prog("已终止", "terminated", "var(--warn)")}
          </div>
          <div class="panel">
            <h3>费用月度趋势（近 6 个月，元）</h3>
            <div class="bar-chart">${bars}</div>
            <div class="legend"><span><i style="background:var(--accent)"></i>应收</span><span><i style="background:var(--ok)"></i>实收</span></div>
          </div>
          <div class="panel" style="grid-column:1/-1">
            <h3>客户费用排名（Top 10）</h3>
            ${s.topCustomers.length === 0 ? `<div class="empty">暂无数据</div>` : `
            <table class="tbl"><thead><tr><th>#</th><th>客户</th><th>案件数</th><th>应收</th><th>实收</th><th>待收</th></tr></thead><tbody>
            ${s.topCustomers.map((r, i) => {
              const pending = r.receivable - r.received;
              return `<tr><td style="color:var(--text3)">${i + 1}</td><td><b>${esc(r.name)}</b></td><td class="dl-cell">${r.caseCount}</td><td>¥${yuan(r.receivable)}</td><td style="color:var(--ok)">¥${yuan(r.received)}</td><td class="dl-cell"${pending > 0 ? ` style="color:var(--warn)"` : ""}>¥${yuan(pending)}</td></tr>`;
            }).join("")}</tbody></table>`}
          </div>
        </div>`;
    }

    async function doRestore(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!confirm("恢复备份将覆盖当前全部数据，确定继续？")) { input.value = ""; return; }
      try {
        const data = JSON.parse(await file.text());
        await api("/api/backup/restore", { method: "POST", body: JSON.stringify(data) });
        toast("恢复成功", "ok");
        input.value = "";
        settingsTab("backup");
      } catch (ex) { toast(ex.message || "备份文件无效", "error"); input.value = ""; }
    }
    function smtpPayload() {
      return {
        host: $("#sm-host").value, port: Number($("#sm-port").value) || (($("#sm-secure").value === "true") ? 465 : 587),
        username: $("#sm-user").value, password: $("#sm-pass").value, from: $("#sm-from").value,
        secure: $("#sm-secure").value === "true", enabled: $("#sm-enabled").checked,
      };

        box.textContent = r.message;

      if (!id) { e.textContent = "SecretId 不能为空"; e.style.display = "block"; return; }
      const box = $("#ocr-result");
      box.textContent = "保存中…"; box.style.color = "var(--text3)";
      try {
        const r = await api("/api/settings/ocr", { method: "PUT", body: JSON.stringify({

          secretKey: key,
          region: $("#ocr-region").value.trim() || "ap-guangzhou",

      const box = $("#sm-mail-result");
      if (confirm("立即扫描待办期限并向收件邮箱发送到期提醒？")) {
        box.textContent = "扫描并发送中…"; box.style.color = "var(--text3)";
        try {
          const r = await api("/api/settings/reminders-run", { method: "POST" });
          box.textContent = r.message; box.style.color = r.ok ? "var(--ok)" : "var(--danger)";

    async function loadTursoStatus() {
      const box = $("#turso-result");
      const snaps = $("#turso-snaps");
      try {
        const st = await api("/api/backup/turso/status");
        if (!st.configured) {
          box.textContent = "未配置 Turso（缺少 TURSO_URL / TURSO_AUTH_TOKEN 环境变量）";
          box.style.color = "var(--warn)"; return;
        }
        if (st.error) { box.textContent = "云端连接失败：" + st.error; box.style.color = "var(--danger)"; }
        else box.textContent = "Turso 已配置 ✓";
        renderTursoSnaps(st.snapshots || []);
      } catch (ex) { box.textContent = "状态查询失败：" + ex.message; box.style.color = "var(--danger)"; }
    }
    function renderTursoSnaps(list) {
      const el = $("#turso-snaps");
      if (!list.length) { el.textContent = "云端暂无备份快照"; return; }
      el.innerHTML = "云端快照：" + list.map((s) =>
        `<span style="display:inline-block;margin:4px 6px 0 0;padding:2px 8px;background:var(--border2);border-radius:10px;font-size:12px">` +
        `${new Date(s.createdAt).toLocaleString("zh-CN")} · 客户 ${s.counts.customers} / 案件 ${s.counts.cases}</span>`
      ).join("");
    }
    async function tursoPush() {
      const box = $("#turso-result");
      box.textContent = "备份中…"; box.style.color = "var(--text3)";
      try {
        const r = await api("/api/backup/turso/push", { method: "POST" });
        box.textContent = "已备份到云端 ✓"; box.style.color = "var(--ok)";
        loadTursoStatus();
      } catch (ex) { box.textContent = ex.message; box.style.color = "var(--danger)"; }
    }
    async function tursoRestore() {
      if (!confirm("从云端最新快照恢复将覆盖当前全部数据，确定继续？")) return;
      const box = $("#turso-result");
      box.textContent = "恢复中…"; box.style.color = "var(--text3)";
      try {
        await api("/api/backup/turso/restore", { method: "POST" });
        box.textContent = "已从云端恢复 ✓"; box.style.color = "var(--ok)";
        settingsTab("backup");
      } catch (ex) { box.textContent = ex.message; box.style.color = "var(--danger)"; }
    }

    // ---------- 启动 ----------
    async function checkSession() {
      try {
        const me = await api("/api/me");
        showApp(me.username);
        setView("dashboard");
      } catch (_) { /* 保持登录页 */ }
    }
    checkSession();
  </script>
</body>
</html>
